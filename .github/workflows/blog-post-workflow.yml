name: Latest Medium blog posts

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@jaiminkavathia30"
          max_post_count: 5
          template: '<li><a href="$url">$title</a> <sub>$date</sub></li>$newline'
          date_format: "UTC:mmm d, yyyy"
          # Drop Medium's ?source=rss tracking suffix from each link
          item_exec: "post.url = post.url.split('?')[0]"
